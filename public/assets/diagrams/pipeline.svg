<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <rect width="720" height="420" fill="#0b0b0f"/>
  <g fill="none" stroke="#7c6cff" stroke-width="2">
    <rect x="220" y="20" width="280" height="70" rx="10" fill="#151520"/>
    <rect x="220" y="130" width="280" height="70" rx="10" fill="#151520"/>
    <rect x="220" y="240" width="280" height="70" rx="10" fill="#151520"/>
    <rect x="220" y="350" width="280" height="50" rx="10" fill="#151520"/>
  </g>
  <g fill="#e8e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">
    <text x="360" y="50">Hermes daily agent</text>
    <text x="360" y="68" fill="#8a8aa0" font-size="12">(open-weight LLM)</text>
    <text x="360" y="160">GitHub repo</text>
    <text x="360" y="178" fill="#8a8aa0" font-size="12">content/posts/*.md</text>
    <text x="360" y="270">Vite Pages build</text>
    <text x="360" y="288" fill="#8a8aa0" font-size="12">static site</text>
    <text x="360" y="380">Cloudflare Pages</text>
  </g>
  <g stroke="#00d9b8" stroke-width="2" marker-end="url(#arrow)">
    <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#00d9b8"/></marker></defs>
    <line x1="360" y1="90" x2="360" y2="130"/>
    <line x1="360" y1="200" x2="360" y2="240"/>
    <line x1="360" y1="310" x2="360" y2="350"/>
  </g>
  <text x="560" y="160" fill="#8a8aa0" font-size="12">review / accept / revert</text>
  <text x="560" y="178" fill="#8a8aa0" font-size="12">git history (Cursor)</text>
  <line x1="500" y1="165" x2="550" y2="165" stroke="#ff9a7c" stroke-width="2" marker-end="url(#arrow2)"/>
  <defs><marker id="arrow2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ff9a7c"/></marker></defs>
</svg>
